controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["fl_wheel_joint", "rl_wheel_joint"]
    right_wheel_names: ["fr_wheel_joint", "rr_wheel_joint"]
    # Mecanum (X layout) driven left/right turns like a diff drive with
    # separation 2 * (lx + ly) = 2 * (0.085 + 0.135). Keep in sync with the URDF.
    wheel_separation: 0.44
    wheel_radius: 0.05

    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: true
    publish_rate: 50.0
    cmd_vel_timeout: 0.5
    # Echo the rate-limited command on ~/cmd_vel_out, for evaluation
    publish_limited_velocity: true

    # Ramp forward speed so the wheels don't slip on takeoff; slip corrupts odometry heading.
    # No turn-rate limit: the NMPC model assumes instant turn rate, and lag makes it oscillate.
    linear.x.max_acceleration: 1.0
    linear.x.max_deceleration: -1.0
