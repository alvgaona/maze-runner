controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    # Keep in sync with urdf/maze_runner.urdf.xacro
    wheel_separation: 0.34
    wheel_radius: 0.08

    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: true
    publish_rate: 50.0
    cmd_vel_timeout: 0.5

    # Ramp forward speed so the wheels don't slip on takeoff; slip corrupts odometry heading.
    # No turn-rate limit: the NMPC model assumes instant turn rate, and lag makes it oscillate.
    linear.x.max_acceleration: 1.0
    linear.x.max_deceleration: -1.0
