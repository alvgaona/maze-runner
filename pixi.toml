[workspace]
name = "maze-runner"
channels = ["robostack-lyrical", "conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[system-requirements]
macos = "14.0"

[dependencies]
ros-lyrical-desktop = "*"
ros-lyrical-ros-gz = "*"
ros-lyrical-gz-ros2-control = "*"
ros-lyrical-diff-drive-controller = "*"
ros-lyrical-joint-state-broadcaster = "*"
ros-lyrical-xacro = "*"
eigen = "*"
colcon-common-extensions = "*"
cmake = "*"
ninja = "*"
pkg-config = "*"
c-compiler = "*"
cxx-compiler = "*"

[tasks]
build = "colcon build --symlink-install --cmake-args -G Ninja -DCMAKE_BUILD_TYPE=Release"
test = { cmd = "colcon test --event-handlers console_direct+ && colcon test-result --verbose", depends-on = ["build"] }
sim = { cmd = "bash -c 'source install/setup.bash && ros2 launch maze_runner_gazebo sim.launch.xml'", depends-on = ["build"] }
